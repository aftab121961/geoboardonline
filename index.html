<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Geoboard - Interactive Geometry & Pick's Theorem Explorer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-sky-500 selection:text-white">

  <!-- TOP HEADER NAVIGATION BAR -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30 px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-rose-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold font-heading bg-gradient-to-r from-white via-slate-200 to-sky-400 bg-clip-text text-transparent">
          Digital Geoboard
        </h1>
        <p class="text-xs text-slate-400 font-medium">Interactive Geometry, Pick's Theorem & Angle Measurements</p>
      </div>
    </div>

    <!-- TOP TOOLBAR CONTROLS -->
    <div class="flex items-center gap-3">
      <!-- Grid Selector -->
      <div class="flex items-center gap-2 bg-slate-800/80 p-1 rounded-lg border border-slate-700/60">
        <label for="gridTypeSelect" class="text-xs text-slate-400 font-medium pl-2">Grid:</label>
        <select id="gridTypeSelect" class="bg-slate-900 text-xs font-semibold text-sky-400 rounded-md px-2.5 py-1.5 border border-slate-700 focus:outline-none focus:border-sky-500 cursor-pointer">
          <option value="square5">5×5 Square Grid</option>
          <option value="square10">10×10 Square Grid</option>
          <option value="isometric">Isometric (Triangular)</option>
          <option value="circular">Circular (Concentric Rings)</option>
        </select>
      </div>

      <!-- Presets Selector -->
      <select id="presetSelect" class="bg-slate-800 text-xs font-medium text-slate-300 rounded-lg px-3 py-2 border border-slate-700 hover:border-slate-600 focus:outline-none focus:border-sky-500 cursor-pointer">
        <option value="">-- Shape Presets --</option>
      </select>

      <div class="h-5 w-px bg-slate-800 mx-1"></div>

      <!-- Undo / Redo / Clear / Export -->
      <button id="btnUndo" title="Undo (Ctrl+Z)" class="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-lg border border-slate-700/60 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
      </button>

      <button id="btnRedo" title="Redo (Ctrl+Y)" class="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-lg border border-slate-700/60 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"/></svg>
      </button>

      <button id="btnClear" class="px-3 py-1.5 text-xs font-medium text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 rounded-lg transition active:scale-95 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        Clear Board
      </button>

      <button id="btnExport" class="px-3 py-1.5 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-500 rounded-lg shadow-md shadow-sky-600/20 border border-sky-400/30 transition active:scale-95 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Export PNG
      </button>
    </div>
  </header>

  <!-- MAIN APP CONTENT (SIDEBAR + CANVAS + MATH HUD) -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 max-w-[1700px] w-full mx-auto">

    <!-- LEFT SIDEBAR: TOOLS & COLOR PALETTE -->
    <aside class="lg:col-span-3 flex flex-col gap-5">
      
      <!-- Tool Modes Card -->
      <div class="glass-panel p-5 rounded-2xl space-y-4">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Geometry Tools</h2>

        <div class="grid grid-cols-1 gap-2.5">
          <!-- Draw Rubber Band Mode Button -->
          <button id="modeDraw" class="active-mode w-full p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-left transition flex items-center gap-3 group">
            <div class="p-2 rounded-lg bg-slate-900 text-sky-400 border border-slate-700/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
            </div>
            <div>
              <div class="text-sm font-semibold text-white">Stretch Rubber Band</div>
              <div class="text-[11px] text-slate-400">Draw Polygons or Line Segments</div>
            </div>
          </button>

          <!-- Draw Circle Tool Button -->
          <button id="modeCircle" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-left transition flex items-center gap-3 group">
            <div class="p-2 rounded-lg bg-slate-900 text-indigo-400 border border-slate-700/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
            </div>
            <div>
              <div class="text-sm font-semibold text-white">Draw Circle Band</div>
              <div class="text-[11px] text-slate-400">Click Center peg then Radius peg</div>
            </div>
          </button>

          <!-- Finish Open Line Button -->
          <button id="btnFinishLine" class="w-full py-2 px-3 rounded-xl border border-sky-500/40 bg-sky-500/10 hover:bg-sky-500/20 text-xs font-semibold text-sky-300 flex items-center justify-center gap-2 transition active:scale-95">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            Finish Line Segment / Polyline (Enter)
          </button>

          <!-- Select & Edit Vertices Button -->
          <button id="modeSelect" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-left transition flex items-center gap-3 group">
            <div class="p-2 rounded-lg bg-slate-900 text-emerald-400 border border-slate-700/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/></svg>
            </div>
            <div>
              <div class="text-sm font-semibold text-white">Select & Drag Vertices</div>
              <div class="text-[11px] text-slate-400">Drag points to reshape polygon</div>
            </div>
          </button>

          <!-- Protractor Angle Tool Button -->
          <button id="modeProtractor" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-left transition flex items-center gap-3 group">
            <div class="p-2 rounded-lg bg-slate-900 text-rose-400 border border-slate-700/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
            </div>
            <div>
              <div class="text-sm font-semibold text-white">Protractor Angle Tool</div>
              <div class="text-[11px] text-slate-400">Click 3 vertices to measure angle</div>
            </div>
          </button>

          <!-- Ruler Distance Tool Button -->
          <button id="modeRuler" class="w-full p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-left transition flex items-center gap-3 group">
            <div class="p-2 rounded-lg bg-slate-900 text-amber-400 border border-slate-700/50">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            </div>
            <div>
              <div class="text-sm font-semibold text-white">Ruler Measurement Tool</div>
              <div class="text-[11px] text-slate-400">Click 2 pegs to measure distance</div>
            </div>
          </button>
        </div>

        <div class="pt-2 border-t border-slate-800 space-y-2">
          <button id="btnVirtualProtractor" class="w-full py-2 px-3 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700 text-xs font-semibold text-sky-400 flex items-center justify-center gap-2 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Toggle 360° Virtual Protractor
          </button>

          <button id="btnVirtualRuler" class="w-full py-2 px-3 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700 text-xs font-semibold text-amber-400 flex items-center justify-center gap-2 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            Toggle 2D Virtual Classroom Ruler
          </button>
        </div>
      </div>

      <!-- Band Color Palette Card -->
      <div class="glass-panel p-5 rounded-2xl space-y-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Rubber Band Color</h2>
        <div id="colorPalette" class="flex items-center justify-between gap-2 pt-1">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>

      <!-- Board Options & View Toggles -->
      <div class="glass-panel p-5 rounded-2xl space-y-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Grid Settings</h2>

        <label class="flex items-center justify-between text-xs text-slate-300 cursor-pointer">
          <span>Show Grid Guide Lines</span>
          <input type="checkbox" id="toggleGridLines" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-sky-500 focus:ring-offset-slate-900" />
        </label>

        <label class="flex items-center justify-between text-xs text-slate-300 cursor-pointer">
          <span>Show Peg Coordinates</span>
          <input type="checkbox" id="togglePegLabels" class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-sky-500 focus:ring-sky-500 focus:ring-offset-slate-900" />
        </label>

        <div class="pt-2 border-t border-slate-800">
          <button id="btnDeleteShape" class="w-full py-2 px-3 rounded-lg text-xs font-medium text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition flex items-center justify-center gap-1.5">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Delete Selected Polygon
          </button>
        </div>
      </div>

    </aside>

    <!-- CENTER GEOBOARD CANVAS VIEWPORT -->
    <section class="lg:col-span-6 flex flex-col items-center justify-center">
      <div class="canvas-wrapper w-full max-w-[700px] aspect-square">
        <canvas id="geoboardCanvas" class="rounded-xl cursor-crosshair touch-none"></canvas>
      </div>

      <!-- Quick Hint Footer -->
      <div class="mt-4 flex items-center justify-between w-full max-w-[700px] text-xs text-slate-400 bg-slate-900/60 px-4 py-2.5 rounded-xl border border-slate-800">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400 pulse-glow"></span>
          Click pegs to stretch band. Double-click, press Enter, or click starting peg to complete line or polygon.
        </span>
        <span class="font-mono text-slate-500">Esc to cancel</span>
      </div>
    </section>

    <!-- RIGHT SIDEBAR: MATHEMATICS & GEOMETRY HUD -->
    <aside class="lg:col-span-3">
      <div class="glass-panel p-5 rounded-2xl h-full space-y-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
            Math Inspector & Solver
          </h2>
        </div>

        <!-- Dynamic Math HUD Content Container -->
        <div id="mathHUD" class="space-y-4">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>
    </aside>

  </main>

  <!-- APP ENTRY POINT SCRIPT -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
