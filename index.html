<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Geoboard - Interactive Geometry Explorer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col antialiased selection:bg-sky-500 selection:text-white transition-colors duration-300">

  <!-- TOP HEADER NAVIGATION BAR -->
  <header class="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40 px-6 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 via-indigo-500 to-rose-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold font-heading bg-gradient-to-r from-sky-400 via-indigo-300 to-rose-400 bg-clip-text text-transparent">
          Virtual Geoboard
        </h1>
        <p class="text-xs text-slate-400 font-medium">Interactive Geometry, Pen Drawing & Distance Exploration</p>
      </div>
    </div>

    <!-- TOP TOOLBAR CONTROLS -->
    <div class="flex items-center gap-3">
      <!-- Grid Selector (Includes 15x8 Option) -->
      <div class="flex items-center gap-2 bg-slate-800/80 p-1 rounded-xl border border-slate-700/60 shadow-inner">
        <label for="gridTypeSelect" class="text-xs text-slate-400 font-medium pl-2">Grid:</label>
        <select id="gridTypeSelect" class="bg-slate-900 text-xs font-semibold text-sky-400 rounded-lg px-3 py-1.5 border border-slate-700 focus:outline-none focus:border-sky-500 cursor-pointer">
          <option value="square5">5×5 Grid</option>
          <option value="square10">10×10 Grid</option>
          <option value="grid15x8">15×8 Grid</option>
          <option value="isometric">Isometric (Triangular)</option>
          <option value="circular">Circular (Rings)</option>
        </select>
      </div>

      <!-- Presets Selector -->
      <select id="presetSelect" class="bg-slate-800 text-xs font-medium text-slate-300 rounded-xl px-3 py-2 border border-slate-700 hover:border-slate-600 focus:outline-none focus:border-sky-500 cursor-pointer">
        <option value="">-- Shape Presets --</option>
      </select>

      <div class="h-5 w-px bg-slate-800 mx-1"></div>

      <!-- White / Dark Theme Toggle Button -->
      <button id="btnThemeToggle" title="Toggle Light / Dark Theme" class="p-2 text-amber-400 hover:text-amber-300 bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-slate-700/60 transition active:scale-95 flex items-center gap-1.5 text-xs font-semibold">
        <svg id="themeIconSun" class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
        </svg>
        <span id="themeToggleText">White Theme</span>
      </button>

      <!-- Undo / Redo / Clear / Export -->
      <button id="btnUndo" title="Undo (Removes last band, ruler distance label, or pen stroke)" class="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-slate-700/60 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
      </button>

      <button id="btnRedo" title="Redo" class="p-2 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 rounded-xl border border-slate-700/60 transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10H11a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"/></svg>
      </button>

      <button id="btnClear" title="Clear All Board Elements" class="p-2 text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 rounded-xl transition active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>

      <button id="btnExport" title="Export PNG Image" class="px-3 py-1.5 text-xs font-semibold text-white bg-sky-600 hover:bg-sky-500 rounded-xl shadow-md shadow-sky-600/20 border border-sky-400/30 transition active:scale-95 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Export PNG
      </button>
    </div>
  </header>

  <!-- LEFTMOST FIXED TOOLBOX -->
  <aside class="fixed left-4 top-24 z-30 flex flex-col gap-3">
    
    <!-- Geometry & Drawing Icon Tools Panel -->
    <div class="glass-panel p-2.5 rounded-2xl flex flex-col items-center gap-2 shadow-2xl border border-slate-700/60">
      
      <!-- Stretch Rubber Band Tool -->
      <button id="modeDraw" data-tooltip="Stretch Rubber Band Line" class="icon-tool-btn active-mode p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-sky-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
      </button>

      <!-- Draw Circle Tool -->
      <button id="modeCircle" data-tooltip="Draw Circle Band" class="icon-tool-btn p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-indigo-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
      </button>

      <!-- Freehand Pen Drawing Tool -->
      <button id="modePen" data-tooltip="Freehand Pen Tool (Draw / Write)" class="icon-tool-btn p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-emerald-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
      </button>

      <!-- Protractor Angle Tool Icon -->
      <button id="modeProtractor" data-tooltip="Protractor Angle Measurement Tool" class="icon-tool-btn p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-rose-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/></svg>
      </button>

      <!-- Ruler Distance Tool Icon -->
      <button id="modeRuler" data-tooltip="Ruler Distance Measurement Tool" class="icon-tool-btn p-3 rounded-xl border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-amber-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
      </button>

      <div class="w-full h-px bg-slate-800 my-1"></div>

      <!-- 360° Virtual Protractor Overlay -->
      <button id="btnVirtualProtractor" data-tooltip="Toggle 360° Virtual Protractor" class="icon-tool-btn p-3 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700 text-sky-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      </button>

      <!-- 2D Virtual Ruler Overlay -->
      <button id="btnVirtualRuler" data-tooltip="Toggle 2D Virtual Ruler" class="icon-tool-btn p-3 rounded-xl border border-slate-700 bg-slate-800/60 hover:bg-slate-700 text-amber-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <!-- Delete Selected Band -->
      <button id="btnDeleteShape" data-tooltip="Delete Selected Band" class="icon-tool-btn p-3 rounded-xl border border-rose-500/30 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
      </button>

      <!-- Toggle Grid Lines -->
      <label data-tooltip="Toggle Grid Lines" class="cursor-pointer">
        <input type="checkbox" id="toggleGridLines" checked class="hidden peer" />
        <div class="p-3 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-400 peer-checked:text-sky-400 peer-checked:border-sky-500 peer-checked:bg-sky-500/10 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16M6 4v16M12 4v16M18 4v16"/></svg>
        </div>
      </label>

    </div>

  </aside>

  <!-- CENTER GEOBOARD CANVAS VIEWPORT -->
  <main class="flex-1 flex flex-col items-center justify-center py-6 px-16 w-full max-w-[1400px] mx-auto">
    <div class="canvas-wrapper w-full aspect-square max-w-[820px] shadow-2xl">
      <canvas id="geoboardCanvas" class="rounded-xl cursor-crosshair touch-none"></canvas>
    </div>
  </main>

  <!-- FLOATING HORIZONTAL COLOR PALETTE AT BOTTOM -->
  <div id="floatingColorBar" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 glass-panel px-5 py-2.5 rounded-full flex items-center gap-3 shadow-2xl border border-slate-700/60 backdrop-blur-xl">
    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider pr-1">Band & Pen Color:</span>
    <div id="colorPalette" class="flex items-center gap-2.5">
      <!-- Populated dynamically by app.js -->
    </div>
  </div>

  <!-- APP ENTRY POINT SCRIPT -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
